name: Learning by Doing Smoke Test
on:
  push:
    branches: [main, codex/source-grounded-study-import]
  pull_request:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Python API and provider checks (no paid requests)
        run: python3 -B -m unittest discover -s tests -p 'test_*.py'
      - name: Question formats and import regression checks
        run: node --test tests/*.test.cjs
      - name: JavaScript syntax
        run: |
          node --check dist/app.js
          node --check dist/local-learning.js
          node --check dist/teacher.js
