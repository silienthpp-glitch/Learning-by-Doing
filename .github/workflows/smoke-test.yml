name: Learning by Doing Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax
        run: python3 -m py_compile start.py

      - name: JavaScript syntax
        run: node --check dist/app.js

      - name: Local AI API integration with mocked Ollama
        run: |
          python3 - <<'PY'
          import json
          import threading
          import urllib.request
          from functools import partial
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          import start

          class FakeOllama(BaseHTTPRequestHandler):
              def log_message(self, *args):
                  pass

              def send_json(self, payload):
                  body = json.dumps(payload).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def do_GET(self):
                  if self.path == "/api/tags":
                      self.send_json({"models": [{"name": "qwen3.5:4b"}]})
                  else:
                      self.send_response(404)
                      self.end_headers()

              def do_POST(self):
                  length = int(self.headers.get("Content-Length", "0"))
                  payload = json.loads(self.rfile.read(length) or b"{}")
                  system = ""
                  for message in payload.get("messages", []):
                      if message.get("role") == "system":
                          system = message.get("content", "")
                  if "bewertest Antworten" in system:
                      result = {
                          "rating": "correct",
                          "score": 1,
                          "feedback": "Fachlich korrekt.",
                          "modelAnswer": "SELECT * FROM users;"
                      }
                  else:
                      result = {
                          "analysis": {"topic": "SQL", "subtopics": ["SELECT"], "keyTerms": ["SELECT"]},
                          "questions": [{
                              "type": "text",
                              "topic": "SQL",
                              "subtopic": "SELECT",
                              "prompt": "Welche SQL-Anweisung liest alle Datensätze aus users?",
                              "answer": "SELECT * FROM users;",
                              "options": [],
                              "correctOptions": [],
                              "aliases": [],
                              "explanation": "SELECT liest Datensätze.",
                              "steps": [],
                              "points": 1
                          }]
                      }
                  self.send_json({"message": {"content": json.dumps(result)}})

          fake = ThreadingHTTPServer(("127.0.0.1", 0), FakeOllama)
          fake_port = fake.server_address[1]
          threading.Thread(target=fake.serve_forever, daemon=True).start()
          start.OLLAMA_URL = f"http://127.0.0.1:{fake_port}"
          start.OLLAMA_MODEL = "qwen3.5:4b"
          start.OPENAI_API_KEY = ""

          handler = partial(start.LearningHandler, directory=str(start.DIST))
          app = ThreadingHTTPServer(("127.0.0.1", 0), handler)
          app_port = app.server_address[1]
          threading.Thread(target=app.serve_forever, daemon=True).start()
          base = f"http://127.0.0.1:{app_port}"

          def get_json(path):
              with urllib.request.urlopen(base + path, timeout=5) as r:
                  return json.loads(r.read())

          def post_json(path, payload):
              req = urllib.request.Request(
                  base + path,
                  data=json.dumps(payload).encode(),
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=5) as r:
                  return json.loads(r.read())

          with urllib.request.urlopen(base + "/", timeout=5) as r:
              html = r.read().decode()
          assert "Learning by Doing" in html

          status = get_json("/api/ai/status")
          assert status["ollama"]["reachable"] is True
          assert status["ollama"]["activeModel"] == "qwen3.5:4b"
          assert status["openai"]["available"] is False

          generated = post_json("/api/ai/generate", {
              "provider": "ollama",
              "subject": "Datenbanken",
              "topic": "SQL",
              "count": 10,
              "context": "SQL SELECT liest Daten aus Tabellen. Ein Primärschlüssel identifiziert Datensätze eindeutig. " * 3,
          })
          assert generated["questions"]
          assert generated["questions"][0]["topic"] == "SQL"

          evaluated = post_json("/api/ai/evaluate", {
              "provider": "ollama",
              "question": generated["questions"][0],
              "answer": "SELECT * FROM users;",
          })
          assert evaluated["rating"] == "correct"
          assert evaluated["score"] == 1

          app.shutdown()
          fake.shutdown()
          print("Smoke test OK")
          PY
