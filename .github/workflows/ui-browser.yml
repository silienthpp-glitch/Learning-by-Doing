name: Browser UI tests
on:
  push:
    branches: [feat/modern-learning-gui]
  workflow_dispatch:

concurrency:
  group: ui-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser tests
        run: |
          mkdir -p /tmp/learning-by-doing-playwright
          cd /tmp/learning-by-doing-playwright
          npm init -y
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 start.py >/tmp/learning-by-doing-server.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 1
          done
      - name: Test browsers
        env:
          NODE_PATH: /tmp/learning-by-doing-playwright/node_modules
        run: node tests/ui-smoke.cjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learning-by-doing-ui-screenshots
          path: ui-screenshots/
          retention-days: 7
